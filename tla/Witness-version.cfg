SPECIFICATION WSpec
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    w1 = w1
    Nodes = {n1, n2, n3}
    Producers = {n1}
    Writers = {w1}
    Batches = 3
    MaxCrashes = 0
    MaxFx = 7
    MaxCmd = 3
    MaxSnap = 4
    SnapTrim = "version"
INVARIANTS EffectsCorrect ExactlyOnce NodesCorrect SnapshotsCorrect Recoverable CommandsRetained OnlyLaggardsRestore Unfinished
CHECK_DEADLOCK FALSE
PROPERTY RestoresProgress
