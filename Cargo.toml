[package]
name = "sqlog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rmp-serde = "1"
rquickjs = "0.14.0"
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14.3"

[profile.release]
debug = 1
# A panicking task must take the process down, not leave it running without its loops.
panic = "abort"
